name: Opportunities email intake
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: opportunities-email-intake
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.OPPORTUNITIES_DATABASE_URL }}
      - name: Renew live email subscription and retry saved notifications
        run: node scripts/sync-opportunities-mail.cjs --apply --maintain
        env:
          DATABASE_URL: ${{ secrets.OPPORTUNITIES_DATABASE_URL }}
          MICROSOFT_TENANT_ID: ${{ secrets.OPPORTUNITIES_MICROSOFT_TENANT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.OPPORTUNITIES_MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.OPPORTUNITIES_MICROSOFT_CLIENT_SECRET }}
